<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài Khoản Khách Hàng - ShopCloth</title>
    <link rel="icon" type="image/png" href="images/logo-cat.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="main-header">
        <div class="logo">
            <a href="index.html">
                <span class="logo-badge-icon">🐱</span>
                <span>ShopCloth</span>
            </a>
        </div>
        <div class="header-right-group">
            <nav class="navbar">
                <!-- Nút Home icon -->
                <a href="index.html" class="nav-home-btn" title="Trang chủ">
                    <svg width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </a>
            </nav>

            <!-- Icon Giỏ Hàng có Badge số lượng -->
            <a href="cart.html" class="nav-cart-btn" title="Giỏ hàng của bạn">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
                <span id="cartCountBadge" class="cart-badge"></span>
            </a>

            <!-- Phần người dùng nằm bên trái nút 3 gạch -->
            <div id="navUserSlot" style="display: inline-flex; align-items: center;">
                <a href="account.html" class="nav-account-link" style="color: var(--primary); font-size: 14.5px; font-weight: 600; text-decoration: none; padding: 6px 12px;">Tài Khoản</a>
            </div>

            <!-- Góc nút 3 gạch (không nền) -->
            <div class="menu-toggle-wrapper">
                <button type="button" class="btn-hamburger" id="btnHamburgerMenu" title="Menu quản trị">
                    ☰
                </button>
                <div class="hamburger-dropdown" id="hamburgerDropdown">
                    <a href="admin/login.html">
                        <span>🔐</span>
                        <span>Đăng nhập quản trị</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="container" style="flex-direction: column;">
        <!-- Khung Đăng nhập / Đăng ký (Hiển thị khi chưa đăng nhập) -->
        <div id="authFormsWrap" class="account-card-wrap">
            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Đăng Nhập</button>
                <button type="button" class="auth-tab-btn" id="tabRegisterBtn" onclick="switchAuthTab('register')">Đăng Ký</button>
            </div>

            <!-- Form Đăng Nhập (Bỏ hết ràng buộc) -->
            <form id="userLoginForm">
                <div class="form-group-customer">
                    <label for="loginUserEmail">Email hoặc Tên tài khoản:</label>
                    <input type="text" id="loginUserEmail" class="form-control-customer" placeholder="vd: nguyenvana@gmail.com" value="nguyenvanan@gmail.com">
                </div>

                <div class="form-group-customer">
                    <label for="loginUserPassword">Mật khẩu:</label>
                    <input type="password" id="loginUserPassword" class="form-control-customer" placeholder="Nhập mật khẩu bất kỳ" value="123456">
                </div>

                <button type="submit" class="btn-primary" style="padding: 14px; font-size: 15.5px; border-radius: 14px;">
                    Đăng Nhập
                </button>
            </form>

            <!-- Form Đăng Ký (Bỏ hết ràng buộc) -->
            <form id="userRegisterForm" style="display: none;">
                <div class="form-group-customer">
                    <label for="regName">Họ và tên:</label>
                    <input type="text" id="regName" class="form-control-customer" placeholder="vd: Nguyễn Văn An">
                </div>

                <div class="form-group-customer">
                    <label for="regEmail">Email:</label>
                    <input type="email" id="regEmail" class="form-control-customer" placeholder="vd: an.nguyen@gmail.com">
                </div>

                <div class="form-group-customer">
                    <label for="regPhone">Số điện thoại:</label>
                    <input type="text" id="regPhone" class="form-control-customer" placeholder="vd: 0912345678">
                </div>

                <div class="form-group-customer">
                    <label for="regPassword">Mật khẩu:</label>
                    <input type="password" id="regPassword" class="form-control-customer" placeholder="Nhập mật khẩu bất kỳ">
                </div>

                <button type="submit" class="btn-primary" style="padding: 14px; font-size: 15.5px; border-radius: 14px;">
                    Đăng Ký Tài Khoản
                </button>
            </form>
        </div>

        <!-- Khung Thông Tin Tài Khoản & Lịch Sử Đơn Hàng (Hiển thị khi đã đăng nhập) -->
        <div id="accountDashboardView" style="display: none; width: 100%;">
            <div class="cart-box" style="margin-bottom: 24px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
                    <div>
                        <h2 style="margin-bottom: 4px; border-bottom: none; padding-bottom: 0;">Xin Chào, <span id="accUserName">Nguyễn Văn An</span> 👋</h2>
                        <p style="color: #94a3b8; font-size: 14px;">Email: <strong id="accUserEmail">nguyenvanan@gmail.com</strong> • SĐT: <strong id="accUserPhone">0901234567</strong></p>
                    </div>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button type="button" class="btn-primary" onclick="openEditProfileModal()" style="width: auto; padding: 8px 18px; font-size: 13.5px; background: #0284c7;">
                            ✏️ Chỉnh sửa thông tin
                        </button>
                        <button type="button" id="btnUserLogout" class="btn-primary" style="width: auto; padding: 8px 18px; font-size: 13.5px; background: #334155;">
                            Đăng Xuất
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bảng Lịch Sử Đơn Hàng Của Khách Hàng -->
            <div class="cart-box">
                <h2>Lịch Sử Đơn Đặt Hàng Của Bạn</h2>
                <div style="overflow-x: auto;">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Mã đơn</th>
                                <th>Ngày đặt</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th>Chi tiết</th>
                            </tr>
                        </thead>
                        <tbody id="userOrderHistoryBody">
                            <!-- Rendered by js/main.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Chỉnh sửa thông tin khách hàng -->
    <div id="editProfileModal" class="modal-backdrop" style="position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px;">
        <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 480px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: #f8fafc; font-size: 18px;">Chỉnh Sửa Thông Tin Cá Nhân</h3>
                <button type="button" onclick="closeEditProfileModal()" style="background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer;">&times;</button>
            </div>
            <form onsubmit="handleSaveProfile(event)">
                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-size: 13.5px; color: #cbd5e1; margin-bottom: 6px;">Họ và tên:</label>
                    <input type="text" id="editCustName" value="Nguyễn Văn An" class="form-control-customer" style="width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px;">
                </div>
                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-size: 13.5px; color: #cbd5e1; margin-bottom: 6px;">Số điện thoại:</label>
                    <input type="text" id="editCustPhone" value="0901234567" class="form-control-customer" style="width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px;">
                </div>
                <div style="margin-bottom: 14px;">
                    <label style="display: block; font-size: 13.5px; color: #cbd5e1; margin-bottom: 6px;">Email:</label>
                    <input type="email" id="editCustEmail" value="nguyenvanan@gmail.com" class="form-control-customer" style="width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13.5px; color: #cbd5e1; margin-bottom: 6px;">Địa chỉ giao hàng mặc định:</label>
                    <input type="text" id="editCustAddress" value="123 Lê Lợi, Phường Bến Nghé, Quận 1, TP. Hồ Chí Minh" class="form-control-customer" style="width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeEditProfileModal()" style="padding: 10px 20px; border-radius: 8px; border: 1px solid #475569; background: #334155; color: #f8fafc; cursor: pointer;">Hủy</button>
                    <button type="submit" class="btn-primary" style="padding: 10px 22px; width: auto;">Lưu Thay Đổi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Frontend JS -->
    <script src="js/main.js"></script>
    <script>
        function openEditProfileModal() {
            document.getElementById('editProfileModal').style.display = 'flex';
        }

        function closeEditProfileModal() {
            document.getElementById('editProfileModal').style.display = 'none';
        }

        function handleSaveProfile(e) {
            e.preventDefault();
            const newName = document.getElementById('editCustName').value.trim();
            const newPhone = document.getElementById('editCustPhone').value.trim();
            const newEmail = document.getElementById('editCustEmail').value.trim();

            if (newName) document.getElementById('accUserName').textContent = newName;
            if (newPhone) document.getElementById('accUserPhone').textContent = newPhone;
            if (newEmail) document.getElementById('accUserEmail').textContent = newEmail;

            closeEditProfileModal();
            alert('Đã cập nhật thông tin khách hàng thành công!');
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('userLoginForm');
            const registerForm = document.getElementById('userRegisterForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabLoginBtn.classList.remove('active');
                tabRegisterBtn.classList.add('active');
            }
        }
    </script>
</body>
</html>
